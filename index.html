<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Switching</title>
    <meta name="description" content="Content Switching on a container visualized">
    <link rel="stylesheet" href="style.css">
    <script src="./index.cjs" defer></script>
</head>

<body>
    <main>
        <h1>Content Switching Visualized</h1>
        <ul class="app">
            <li>
                <button class="glass" data-content="c" id="g1"></button>
            </li>
            <li>
                <button class="glass" data-content="t" id="g2"></button>
            </li>
            <li>
                <button class="glass" data-content="" id="g3"></button>
            </li>
        </ul>
    </main>
</body>

</html>
